<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tracker Latihan Harian</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      padding: 20px;
      background: #f8f9fa;
    }
    h2 {
      text-align: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      border-radius: 10px;
      overflow: hidden;
    }
    th, td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }
    th {
      background: #007bff;
      color: white;
    }
    input[type="checkbox"] {
      transform: scale(1.2);
    }
    .catatan {
      width: 100%;
      padding: 8px;
      font-size: 14px;
      box-sizing: border-box;
    }
    .reset-btn {
      margin-top: 20px;
      background: #dc3545;
      color: white;
      border: none;
      padding: 10px 16px;
      font-size: 14px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>📋 Tracker Latihan Harian</h2>
  <p style="text-align:center">Target: Latihan ringan setiap 2 jam</p>

  <table id="trackerTable">
    <thead>
      <tr>
        <th>Waktu</th>
        <th>Push-up</th>
        <th>Grip</th>
        <th>Lunges</th>
        <th>Squat</th>
        <th>Perut</th>
        <th>Catatan</th>
      </tr>
    </thead>
    <tbody>
      <!-- Baris Waktu -->
    </tbody>
  </table>

  <button class="reset-btn" onclick="resetTracker()">🔄 Reset Semua</button>

  <script>
    const waktu = [
      "06.00 - 08.00", "08.00 - 10.00", "10.00 - 12.00", "12.00 - 14.00",
      "14.00 - 16.00", "16.00 - 18.00", "18.00 - 20.00", "20.00 - 22.00"
    ];

    const tbody = document.querySelector('#trackerTable tbody');

    waktu.forEach((w, i) => {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${w}</td>
        ${["push", "grip", "lunges", "squat", "perut"].map(ex => `
          <td><input type="checkbox" id="${ex}${i}"></td>
        `).join('')}
        <td><input class="catatan" id="catatan${i}" placeholder="..." /></td>
      `;
      tbody.appendChild(row);
    });

    function saveState() {
      waktu.forEach((_, i) => {
        ["push", "grip", "lunges", "squat", "perut"].forEach(ex => {
          const checkbox = document.getElementById(`${ex}${i}`);
          localStorage.setItem(`${ex}${i}`, checkbox.checked);
        });
        const note = document.getElementById(`catatan${i}`);
        localStorage.setItem(`catatan${i}`, note.value);
      });
    }

    function loadState() {
      waktu.forEach((_, i) => {
        ["push", "grip", "lunges", "squat", "perut"].forEach(ex => {
          const checkbox = document.getElementById(`${ex}${i}`);
          checkbox.checked = localStorage.getItem(`${ex}${i}`) === "true";
        });
        const note = document.getElementById(`catatan${i}`);
        note.value = localStorage.getItem(`catatan${i}`) || "";
      });
    }

    function resetTracker() {
      if (confirm("Yakin ingin mereset semua data latihan hari ini?")) {
        waktu.forEach((_, i) => {
          ["push", "grip", "lunges", "squat", "perut"].forEach(ex => {
            const checkbox = document.getElementById(`${ex}${i}`);
            checkbox.checked = false;
            localStorage.removeItem(`${ex}${i}`);
          });
          const note = document.getElementById(`catatan${i}`);
          note.value = "";
          localStorage.removeItem(`catatan${i}`);
        });
      }
    }

    // Simpan otomatis saat ada perubahan
    document.addEventListener('input', saveState);

    // Load data saat halaman dibuka
    window.onload = loadState;
  </script>

</body>
</html>
