<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kamera Twibbon Tamuri</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 15px;
    }

    .camera-container {
      position: relative;
      width: 100%;
      aspect-ratio: 9 / 16;
      background: #222;
      overflow: hidden;
      border-radius: 18px;
    }

    video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      left: 0;
      top: 0;

      /* selfie terasa seperti kaca */
      transform: scaleX(-1);
    }

    .twibbon {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: fill;
      left: 0;
      top: 0;
      z-index: 2;
      pointer-events: none;
    }

    .controls {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button,
    a.download {
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    #captureBtn {
      background: #ffffff;
      color: #111;
    }

    #switchBtn {
      background: #333;
      color: white;
    }

    .download {
      display: none;
      text-decoration: none;
      background: #1d9b5c;
      color: white;
    }

    #result {
      width: 100%;
      margin-top: 20px;
      border-radius: 18px;
      display: none;
    }

    canvas {
      display: none;
    }

    .info {
      font-size: 12px;
      color: #aaa;
      margin-top: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>Kamera Twibbon Tamuri</h1>

  <div class="camera-container">

    <video id="video" autoplay playsinline></video>

    <img
      src="tamuri.png"
      class="twibbon"
      id="twibbon"
      alt="Twibbon Tamuri"
    />

  </div>

  <div class="controls">

    <button id="captureBtn">
      📸 Ambil Foto
    </button>

    <button id="switchBtn">
      🔄 Ganti Kamera
    </button>

    <a
      id="downloadBtn"
      class="download"
      download="foto-twibbon-tamuri.png"
    >
      ⬇ Simpan Foto
    </a>

  </div>

  <img id="result" alt="Hasil Foto">

  <canvas id="canvas"></canvas>

  <div class="info">
    Izinkan akses kamera ketika browser meminta izin.
  </div>

</div>


<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const result = document.getElementById("result");
const twibbon = document.getElementById("twibbon");

const captureBtn = document.getElementById("captureBtn");
const switchBtn = document.getElementById("switchBtn");
const downloadBtn = document.getElementById("downloadBtn");

let currentFacingMode = "user";
let currentStream = null;


// ===============================
// BUKA KAMERA
// ===============================

async function startCamera() {

  if (currentStream) {
    currentStream
      .getTracks()
      .forEach(track => track.stop());
  }

  try {

    const constraints = {

      video: {
        facingMode: currentFacingMode,
        width: {
          ideal: 1080
        },
        height: {
          ideal: 1920
        }
      },

      audio: false

    };

    currentStream =
      await navigator.mediaDevices.getUserMedia(
        constraints
      );

    video.srcObject = currentStream;

  }

  catch (error) {

    console.error(error);

    alert(
      "Kamera tidak dapat dibuka. Pastikan izin kamera sudah diberikan."
    );

  }

}


// ===============================
// GANTI KAMERA
// ===============================

switchBtn.addEventListener(
  "click",
  async () => {

    currentFacingMode =
      currentFacingMode === "user"
        ? "environment"
        : "user";

    await startCamera();

  }
);


// ===============================
// AMBIL FOTO
// ===============================

captureBtn.addEventListener(
  "click",
  () => {

    const width = 1080;
    const height = 1920;

    canvas.width = width;
    canvas.height = height;

    const ctx =
      canvas.getContext("2d");


    // ===============================
    // GAMBAR KAMERA
    // ===============================

    if (currentFacingMode === "user") {

      ctx.save();

      ctx.translate(
        width,
        0
      );

      ctx.scale(
        -1,
        1
      );

      drawCover(
        ctx,
        video,
        0,
        0,
        width,
        height
      );

      ctx.restore();

    }

    else {

      drawCover(
        ctx,
        video,
        0,
        0,
        width,
        height
      );

    }


    // ===============================
    // GAMBAR TWIBBON
    // ===============================

    ctx.drawImage(
      twibbon,
      0,
      0,
      width,
      height
    );


    // ===============================
    // HASIL
    // ===============================

    const image =
      canvas.toDataURL(
        "image/png",
        1
      );

    result.src = image;

    result.style.display =
      "block";

    downloadBtn.href =
      image;

    downloadBtn.style.display =
      "inline-block";

    result.scrollIntoView({
      behavior: "smooth"
    });

  }
);


// ===============================
// OBJECT FIT COVER UNTUK CANVAS
// ===============================

function drawCover(
  ctx,
  source,
  x,
  y,
  width,
  height
) {

  const sourceWidth =
    source.videoWidth;

  const sourceHeight =
    source.videoHeight;

  if (
    !sourceWidth ||
    !sourceHeight
  ) return;


  const sourceRatio =
    sourceWidth /
    sourceHeight;

  const targetRatio =
    width /
    height;


  let sx = 0;
  let sy = 0;

  let sw =
    sourceWidth;

  let sh =
    sourceHeight;


  if (
    sourceRatio >
    targetRatio
  ) {

    sw =
      sourceHeight *
      targetRatio;

    sx =
      (sourceWidth - sw) /
      2;

  }

  else {

    sh =
      sourceWidth /
      targetRatio;

    sy =
      (sourceHeight - sh) /
      2;

  }


  ctx.drawImage(
    source,

    sx,
    sy,
    sw,
    sh,

    x,
    y,
    width,
    height
  );

}


// ===============================
// MULAI
// ===============================

startCamera();

</script>

</body>
</html>
