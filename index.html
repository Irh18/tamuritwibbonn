<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#06271b">

  <title>Tamuri Photo Booth</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #04150f;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #0b5c3b 0%, #06271b 40%, #04150f 100%);
      position: relative;
      overflow: hidden;
      padding-bottom: 30px;
    }

    /* HEADER */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: rgba(255,255,255,.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,.08);
    }

    .brand-text strong {
      display: block;
      font-size: 15px;
      font-weight: 700;
    }

    .brand-text span {
      display: block;
      font-size: 11px;
      margin-top: 2px;
      opacity: .65;
    }

    .camera-switch {
      width: 43px;
      height: 43px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,.14);
      color: white;
      font-size: 19px;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    /* CAMERA */

    .camera-wrapper {
      position: relative;
      margin: 0 14px;
      aspect-ratio: 9 / 16;
      overflow: hidden;
      border-radius: 26px;
      background: black;
      box-shadow:
        0 20px 60px rgba(0,0,0,.42),
        inset 0 0 0 1px rgba(255,255,255,.12);
    }

    video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      left: 0;
      top: 0;
    }

    /* Kamera depan mirror */
    video.mirror {
      transform: scaleX(-1);
    }

    .twibbon {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: fill;
      left: 0;
      top: 0;
      z-index: 3;
      pointer-events: none;
    }

    .status {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 5;
      padding: 7px 11px;
      border-radius: 20px;
      background: rgba(0,0,0,.38);
      backdrop-filter: blur(10px);
      font-size: 11px;
    }

    .status-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #39e58c;
      margin-right: 6px;
    }

    /* CONTROLS */

    .controls {
      padding: 22px 22px 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
    }

    .small-control {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,.12);
      color: white;
      font-size: 20px;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .shutter {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 5px solid rgba(255,255,255,.95);
      background: transparent;
      padding: 7px;
      cursor: pointer;
    }

    .shutter-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: white;
      transition: transform .12s ease;
    }

    .shutter:active .shutter-inner {
      transform: scale(.84);
    }

    .hint {
      text-align: center;
      font-size: 12px;
      opacity: .55;
      margin-top: 4px;
      padding: 0 20px;
    }

    /* FLASH */

    .flash {
      position: fixed;
      inset: 0;
      background: white;
      z-index: 80;
      opacity: 0;
      pointer-events: none;
    }

    .flash.active {
      animation: flashAnim .22s ease;
    }

    @keyframes flashAnim {
      0% { opacity: 0; }
      35% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* RESULT */

    .result-page {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at top, #0b5c3b 0%, #06271b 42%, #04150f 100%);
      z-index: 50;
      display: none;
      flex-direction: column;
      align-items: center;
      overflow: auto;
    }

    .result-header {
      width: 100%;
      max-width: 480px;
      padding: 18px 20px;
      text-align: center;
    }

    .result-header strong {
      display: block;
      font-size: 18px;
    }

    .result-header span {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      opacity: .6;
    }

    .result-image-wrap {
      width: calc(100% - 28px);
      max-width: 450px;
      border-radius: 24px;
      overflow: hidden;
      background: black;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    #result {
      width: 100%;
      display: block;
    }

    .action-panel {
      width: 100%;
      max-width: 480px;
      padding: 22px 18px 32px;
    }

    .main-share {
      width: 100%;
      border: none;
      padding: 16px 20px;
      border-radius: 16px;
      background: white;
      color: #07301f;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 12px;
    }

    .secondary-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .secondary-actions button,
    .secondary-actions a {
      border: none;
      padding: 14px;
      border-radius: 14px;
      background: rgba(255,255,255,.11);
      color: white;
      text-decoration: none;
      text-align: center;
      font-size: 14px;
      cursor: pointer;
    }

    /* LOADING */

    .loading {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.72);
      backdrop-filter: blur(8px);
    }

    .loader-box {
      text-align: center;
    }

    .spinner {
      width: 45px;
      height: 45px;
      border: 4px solid rgba(255,255,255,.2);
      border-top-color: white;
      border-radius: 50%;
      margin: auto;
      animation: spin .8s linear infinite;
    }

    .loader-box p {
      margin-top: 15px;
      font-size: 13px;
      opacity: .8;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    canvas {
      display: none;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">

    <div class="brand">

      <div class="brand-icon">
        📸
      </div>

      <div class="brand-text">
        <strong>Tamuri Photo Booth</strong>
        <span>Abadikan momen terbaikmu</span>
      </div>

    </div>

    <button
      class="camera-switch"
      id="switchBtn"
      aria-label="Ganti kamera"
    >
      🔄
    </button>

  </div>


  <div class="camera-wrapper">

    <video
      id="video"
      autoplay
      playsinline
      muted
    ></video>

    <img
      src="tamuri.png"
      class="twibbon"
      id="twibbon"
      alt="Twibbon Tamuri"
    >

    <div class="status">
      <span class="status-dot"></span>
      Kamera aktif
    </div>

  </div>


  <div class="controls">

    <button
      class="small-control"
      id="switchBottom"
      aria-label="Ganti kamera"
    >
      🔄
    </button>

    <button
      class="shutter"
      id="captureBtn"
      aria-label="Ambil foto"
    >
      <div class="shutter-inner"></div>
    </button>

    <button
      class="small-control"
      id="shareInfo"
      aria-label="Info share"
    >
      ↗
    </button>

  </div>

  <div class="hint">
    Tekan tombol kamera untuk mengambil foto
  </div>

</div>


<!-- HASIL FOTO -->

<div
  class="result-page"
  id="resultPage"
>

  <div class="result-header">
    <strong>Foto Kamu ✨</strong>
    <span>Bagikan momen bersama Tamuri Catering</span>
  </div>

  <div class="result-image-wrap">

    <img
      id="result"
      alt="Hasil foto"
    >

  </div>

  <div class="action-panel">

    <button
      class="main-share"
      id="shareBtn"
    >
      📤 Bagikan Foto
    </button>

    <div class="secondary-actions">

      <button id="retakeBtn">
        📷 Foto Ulang
      </button>

      <a
        id="downloadBtn"
        download="tamuri-photo.png"
      >
        ⬇ Simpan
      </a>

    </div>

  </div>

</div>


<!-- LOADING -->

<div
  class="loading"
  id="loading"
>

  <div class="loader-box">

    <div class="spinner"></div>

    <p>Menyiapkan foto...</p>

  </div>

</div>


<!-- FLASH -->

<div
  class="flash"
  id="flash"
></div>


<canvas id="canvas"></canvas>


<script>

  const video =
    document.getElementById("video");

  const canvas =
    document.getElementById("canvas");

  const twibbon =
    document.getElementById("twibbon");

  const captureBtn =
    document.getElementById("captureBtn");

  const switchBtn =
    document.getElementById("switchBtn");

  const switchBottom =
    document.getElementById("switchBottom");

  const result =
    document.getElementById("result");

  const resultPage =
    document.getElementById("resultPage");

  const retakeBtn =
    document.getElementById("retakeBtn");

  const shareBtn =
    document.getElementById("shareBtn");

  const downloadBtn =
    document.getElementById("downloadBtn");

  const loading =
    document.getElementById("loading");

  const flash =
    document.getElementById("flash");


  let stream = null;

  let facingMode = "user";

  let resultBlob = null;

  let photoFile = null;

  let currentObjectURL = null;


  // ==============================
  // MULAI KAMERA
  // ==============================

  async function startCamera() {

    if (stream) {

      stream
        .getTracks()
        .forEach(track => track.stop());

    }

    try {

      stream =
        await navigator.mediaDevices.getUserMedia({

          video: {

            facingMode: {
              ideal: facingMode
            },

            width: {
              ideal: 1920
            },

            height: {
              ideal: 1080
            }

          },

          audio: false

        });


      video.srcObject = stream;

      await video.play();


      // Kamera depan mirror
      // Kamera belakang normal

      if (facingMode === "user") {

        video.classList.add("mirror");

      } else {

        video.classList.remove("mirror");

      }


    } catch (error) {

      console.error(error);

      alert(
        "Kamera tidak dapat dibuka. Pastikan izin kamera sudah diberikan dan website menggunakan HTTPS."
      );

    }

  }


  // ==============================
  // GANTI KAMERA
  // ==============================

  async function switchCamera() {

    facingMode =
      facingMode === "user"
        ? "environment"
        : "user";

    await startCamera();

  }


  switchBtn.addEventListener(
    "click",
    switchCamera
  );


  switchBottom.addEventListener(
    "click",
    switchCamera
  );


  // ==============================
  // AMBIL FOTO LANGSUNG
  // TANPA COUNTDOWN
  // ==============================

  captureBtn.addEventListener(
    "click",
    () => {

      takePhoto();

    }
  );


  // ==============================
  // EFEK FLASH
  // ==============================

  function cameraFlash() {

    flash.classList.remove("active");

    void flash.offsetWidth;

    flash.classList.add("active");

  }


  // ==============================
  // AMBIL FOTO
  // ==============================

  function takePhoto() {

    if (
      !video.videoWidth ||
      !video.videoHeight
    ) {

      alert(
        "Kamera belum siap. Silakan coba lagi."
      );

      return;

    }


    cameraFlash();


    loading.style.display =
      "flex";


    captureBtn.disabled =
      true;


    const width =
      1080;

    const height =
      1920;


    canvas.width =
      width;

    canvas.height =
      height;


    const ctx =
      canvas.getContext("2d");


    ctx.clearRect(
      0,
      0,
      width,
      height
    );


    // ==============================
    // FOTO KAMERA
    // ==============================

    if (facingMode === "user") {

      // Kamera depan:
      // hasil dibuat mirror
      // sama seperti preview selfie

      ctx.save();

      ctx.translate(
        width,
        0
      );

      ctx.scale(
        -1,
        1
      );

      drawCover(
        ctx,
        video,
        0,
        0,
        width,
        height
      );

      ctx.restore();

    } else {

      // Kamera belakang:
      // normal

      drawCover(
        ctx,
        video,
        0,
        0,
        width,
        height
      );

    }


    // ==============================
    // TAMBAHKAN TWIBBON
    // ==============================

    ctx.drawImage(
      twibbon,
      0,
      0,
      width,
      height
    );


    // ==============================
    // BUAT FILE PNG
    // ==============================

    canvas.toBlob(

      blob => {

        if (!blob) {

          loading.style.display =
            "none";

          captureBtn.disabled =
            false;

          alert(
            "Gagal membuat foto."
          );

          return;

        }


        resultBlob =
          blob;


        photoFile =
          new File(

            [blob],

            "tamuri-photo.png",

            {
              type: "image/png"
            }

          );


        if (currentObjectURL) {

          URL.revokeObjectURL(
            currentObjectURL
          );

        }


        currentObjectURL =
          URL.createObjectURL(blob);


        result.src =
          currentObjectURL;


        downloadBtn.href =
          currentObjectURL;


        loading.style.display =
          "none";


        resultPage.style.display =
          "flex";


        captureBtn.disabled =
          false;

      },

      "image/png"

    );

  }


  // ==============================
  // OBJECT FIT COVER UNTUK CANVAS
  // ==============================

  function drawCover(
    ctx,
    source,
    x,
    y,
    width,
    height
  ) {

    const sourceWidth =
      source.videoWidth;

    const sourceHeight =
      source.videoHeight;


    if (
      !sourceWidth ||
      !sourceHeight
    ) {

      return;

    }


    const sourceRatio =
      sourceWidth /
      sourceHeight;


    const targetRatio =
      width /
      height;


    let sx = 0;

    let sy = 0;

    let cropWidth =
      sourceWidth;

    let cropHeight =
      sourceHeight;


    if (
      sourceRatio >
      targetRatio
    ) {

      cropWidth =
        sourceHeight *
        targetRatio;


      sx =
        (
          sourceWidth -
          cropWidth
        ) / 2;

    } else {

      cropHeight =
        sourceWidth /
        targetRatio;


      sy =
        (
          sourceHeight -
          cropHeight
        ) / 2;

    }


    ctx.drawImage(

      source,

      sx,
      sy,

      cropWidth,
      cropHeight,

      x,
      y,

      width,
      height

    );

  }


  // ==============================
  // FOTO ULANG
  // ==============================

  retakeBtn.addEventListener(
    "click",
    () => {

      resultPage.style.display =
        "none";

    }
  );


  // ==============================
  // SHARE FOTO
  // ==============================

  shareBtn.addEventListener(
    "click",
    async () => {

      if (!photoFile) {

        alert(
          "Foto belum tersedia."
        );

        return;

      }


      try {


        // Browser mendukung share file

        if (
          navigator.share &&
          navigator.canShare &&
          navigator.canShare({
            files: [photoFile]
          })
        ) {

          await navigator.share({

            files: [
              photoFile
            ],

            title:
              "Tamuri Catering",

            text:
              "Momen bersama Tamuri Catering ✨"

          });

          return;

        }


        // Browser hanya mendukung share teks

        if (navigator.share) {

          await navigator.share({

            title:
              "Tamuri Catering",

            text:
              "Halal Fair Bersama Tamuri Catering 19-20 September 2026 di SMMCC Makassar✨"

          });

          return;

        }


        // Browser tidak mendukung Web Share

        alert(
          "Browser ini belum mendukung fitur berbagi langsung. Silakan simpan foto terlebih dahulu."
        );


      } catch (error) {


        if (
          error.name !==
          "AbortError"
        ) {

          console.error(error);

          alert(
            "Foto tidak dapat dibagikan. Silakan simpan foto terlebih dahulu."
          );

        }

      }

    }
  );


  // ==============================
  // INFO SHARE
  // ==============================

  document
    .getElementById("shareInfo")
    .addEventListener(
      "click",
      () => {

        alert(
          "Setelah foto diambil, tekan Bagikan Foto untuk membuka menu share HP. Kamu bisa memilih WhatsApp, Instagram, TikTok, Telegram, Facebook, dan aplikasi lain yang tersedia."
        );

      }
    );


  // ==============================
  // PASTIKAN TWIBBON SUDAH LOAD
  // ==============================

  twibbon.addEventListener(
    "error",
    () => {

      alert(
        "File tamuri.png tidak ditemukan. Pastikan tamuri.png berada di folder yang sama dengan index.html."
      );

    }
  );


  // ==============================
  // MULAI
  // ==============================

  startCamera();

</script>

</body>
</html>
